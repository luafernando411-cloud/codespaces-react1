services:
  - type: web
    name: aurora-previdencia-api
    runtime: python
    plan: starter
    region: ohio
    buildCommand: pip install -r requirements.txt && npm ci && npm run build
    preDeployCommand: PYTHONPATH=backend alembic -c backend/alembic.ini upgrade head && PYTHONPATH=backend python -m app.seed
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: NODE_VERSION
        value: 22.15.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aurora-previdencia-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: BANK_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_CPF
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: aurora-previdencia-db
    databaseName: aurora
    user: aurora
    plan: basic-256mb
    region: ohio
